[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 1

# KaskadRouter uses transient storage (EIP-1153) which lands in Cancun.
# Pinning prevents (a) a future solc default flipping forward to a target
# our chains don't support and (b) a stale CI flipping back to Shanghai
# which would make `tstore`/`tload` invalid opcodes (audit F-13).
evm_version = "cancun"

# NitroProver remappings (Marlin attestation verification)
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "nitro-prover/=lib/nitro-prover/src/",
    "marlinprotocol/solidity-cbor/=lib/nitro-prover/lib/solidity-cbor/packages/solidity-cbor/contracts/",
    "marlinprotocol/P384/=lib/nitro-prover/lib/P384/contracts/",
    "marlinprotocol/SolSha2Ext/=lib/nitro-prover/lib/SolSha2Ext/contracts/lib/",
    "@ensdomains/buffer/=lib/nitro-prover/lib/buffer/",
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
